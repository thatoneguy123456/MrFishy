<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr Fishy — coming soon</title>
  <meta name="description" content="mrfishy.co.uk — something's swimming this way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #06283d;
      --mid: #0a4d68;
      --shallow: #088395;
      --foam: #e6fbff;
      --pink: #ff7eb6;
      --pink-dark: #e0568f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--foam);
      background: linear-gradient(180deg, var(--shallow) 0%, var(--mid) 45%, var(--deep) 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* light rays from the surface */
    .rays {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(100deg, rgba(255,255,255,.06) 0 40px, transparent 40px 120px);
      mask-image: linear-gradient(180deg, #000 0%, transparent 60%);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%);
      animation: shimmer 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes shimmer { from { transform: translateX(-30px); } to { transform: translateX(30px); } }

    /* bubbles */
    .bubble {
      position: absolute; bottom: -40px;
      border-radius: 50%;
      border: 2px solid rgba(230,251,255,.5);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,255,255,.05));
      animation: rise linear infinite;
      pointer-events: none;
    }
    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(12px, -55vh); }
      100% { transform: translate(-8px, -115vh); opacity: 0; }
    }

    /* seabed */
    .seabed {
      position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
      background: radial-gradient(ellipse at 20% 120%, #c9a66b 0 60%, transparent 61%),
                  radial-gradient(ellipse at 75% 130%, #b8925a 0 60%, transparent 61%);
      opacity: .55;
      pointer-events: none;
    }

    main { position: relative; z-index: 2; padding: 24px; max-width: 640px; }

    h1 {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1;
      letter-spacing: .01em;
      text-shadow: 0 4px 0 rgba(0,0,0,.18);
    }
    h1 span { color: var(--pink); }

    .tagline {
      margin-top: 14px;
      font-size: clamp(1.05rem, 3.6vw, 1.35rem);
      opacity: .92;
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(230,251,255,.12);
      border: 1px solid rgba(230,251,255,.3);
      font-family: "Fredoka", sans-serif;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .85rem;
    }

    /* Pinkerton */
    .pinkerton-wrap {
      position: absolute; z-index: 1;
      top: 18%;
      left: 0;
      animation: swim 22s linear infinite;
      cursor: pointer;
    }
    .pinkerton {
      width: clamp(120px, 22vw, 180px);
      animation: bob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
    }
    .pinkerton .tail { transform-origin: 34px 50px; animation: wag .5s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes swim {
      0%    { transform: translateX(-220px) scaleX(1); }
      48%   { transform: translateX(calc(100vw + 20px)) scaleX(1); }
      50%   { transform: translateX(calc(100vw + 20px)) scaleX(-1); }
      98%   { transform: translateX(-220px) scaleX(-1); }
      100%  { transform: translateX(-220px) scaleX(1); }
    }
    .nametag {
      display: block;
      font-family: "Fredoka", sans-serif;
      font-weight: 500;
      font-size: .9rem;
      color: var(--pink);
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }

    .speech {
      position: fixed; z-index: 3;
      left: 50%; bottom: 120px;
      transform: translateX(-50%) translateY(20px);
      background: var(--foam); color: var(--deep);
      padding: 10px 18px; border-radius: 16px;
      font-weight: 600;
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    .speech.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer {
      position: absolute; bottom: 14px; left: 0; right: 0; z-index: 2;
      font-size: .85rem; opacity: .75;
    }

    @media (prefers-reduced-motion: reduce) {
      .rays, .bubble, .pinkerton, .pinkerton .tail { animation: none; }
      .pinkerton-wrap { animation: none; left: 50%; transform: translateX(-50%); top: 8%; }
    }
  </style>
</head>
<body>
  <div class="rays"></div>
  <div class="seabed"></div>

  <!-- Pinkerton the fish: swims across the page, click him to say hello -->
  <div class="pinkerton-wrap" id="pinkerton" title="This is Pinkerton">
    <svg class="pinkerton" viewBox="0 0 200 100" aria-label="Pinkerton the fish" role="img">
      <!-- tail -->
      <g class="tail">
        <path d="M38 50 L4 22 Q14 50 4 78 Z" fill="var(--pink-dark)"/>
      </g>
      <!-- top fin -->
      <path d="M80 26 Q105 2 132 24 Z" fill="var(--pink-dark)"/>
      <!-- body -->
      <ellipse cx="100" cy="52" rx="66" ry="34" fill="var(--pink)"/>
      <!-- belly -->
      <ellipse cx="108" cy="64" rx="44" ry="16" fill="#ffc2dc"/>
      <!-- scales -->
      <path d="M70 44 q8 8 0 16 M84 40 q9 10 0 22 M98 38 q10 12 0 26" stroke="var(--pink-dark)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
      <!-- side fin -->
      <path d="M108 60 Q118 78 100 80 Q100 68 108 60 Z" fill="var(--pink-dark)"/>
      <!-- eye -->
      <circle cx="140" cy="44" r="11" fill="#fff"/>
      <circle cx="143" cy="44" r="6" fill="#06283d"/>
      <circle cx="145" cy="41" r="2" fill="#fff"/>
      <!-- smile -->
      <path d="M152 62 q8 6 14 -2" stroke="#06283d" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="nametag">Pinkerton</span>
  </div>

  <main>
    <h1>Mr <span>Fishy</span></h1>
    <p class="tagline">Something's swimming this way. Pinkerton is keeping an eye on things until we're ready.</p>
    <div class="badge">Coming soon</div>
  </main>

  <div class="speech" id="speech">Blub! I'm Pinkerton 🐟</div>

  <footer>&copy; <span id="yr"></span> mrfishy.co.uk</footer>

  <script>
    // year in footer
    document.getElementById("yr").textContent = new Date().getFullYear();

    // make some bubbles
    for (let i = 0; i < 18; i++) {
      const b = document.createElement("div");
      const size = 6 + Math.random() * 22;
      b.className = "bubble";
      b.style.width = b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "vw";
      b.style.animationDuration = 8 + Math.random() * 10 + "s";
      b.style.animationDelay = -Math.random() * 15 + "s";
      document.body.appendChild(b);
    }

    // click Pinkerton to say hello
    const speech = document.getElementById("speech");
    let t;
    document.getElementById("pinkerton").addEventListener("click", () => {
      speech.classList.add("show");
      clearTimeout(t);
      t = setTimeout(() => speech.classList.remove("show"), 2200);
    });
  </script>
</body>
</html>
